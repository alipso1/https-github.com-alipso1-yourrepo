name: Sync Rate Cards from Google Sheets

on:
  # Run automatically every night at 2:00 AM EST (7:00 AM UTC)
  schedule:
    - cron: '0 7 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

  # Allow trigger via webhook from Power Automate
  repository_dispatch:
    types: [sync-rate-cards]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List files
        run: ls -la

      - name: Sync rate cards from Google Sheets
        run: python3 sync_rates.py

      - name: Commit updated pages
        run: |
          git config user.name "Salem Rate Card Bot"
          git config user.email "ratecard-bot@salemcommunications.com"
          git add *.html
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "Auto-sync: update rate cards from Google Sheets $(date +'%Y-%m-%d')"
            git push
            echo "Changes pushed to GitHub"
          fi
