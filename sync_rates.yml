name: Sync Rate Cards from Google Sheets

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-rate-cards]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync rate cards from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python3 sync_rates.py

      - name: Commit updated pages
        run: |
          git config user.name "Salem Rate Card Bot"
          git config user.email "ratecard-bot@salemcommunications.com"
          git add *.html
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "Auto-sync: update rate cards from SharePoint $(date +'%Y-%m-%d')"
            git push
            echo "Changes pushed to GitHub"
          fi
