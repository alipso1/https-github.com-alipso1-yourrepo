name: Sync Seasonal Trends from Google Trends

on:
  # Run automatically every night at 3:00 AM EST (8:00 AM UTC) -- offset an
  # hour from sync_rates.yml so the two workflows never race on the same commit.
  schedule:
    - cron: '0 8 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytrends

      - name: Sync seasonal trends from Google Trends
        run: python3 sync_trends.py
        # Google Trends' unofficial API can throttle or block shared CI IPs.
        # sync_trends.py already falls back to last-known-good values per
        # category on failure, so we don't fail the whole job on a partial sync.
        continue-on-error: true

      - name: Commit updated trends data
        run: |
          git config user.name "Salem Rate Card Bot"
          git config user.email "ratecard-bot@salemcommunications.com"
          git add trends_data.json
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "Auto-sync: update seasonal trends from Google Trends $(date +'%Y-%m-%d')"
            git push
            echo "Changes pushed to GitHub"
          fi
